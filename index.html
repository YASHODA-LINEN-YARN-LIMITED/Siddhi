<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Siddhi HRMS</title>
    <meta name="description" content="Comprehensive self-hosted hire-to-retire HRMS platform featuring core HR, biometric attendance, leave, payroll, recruitment, performance, and self-service." />
    <meta property="og:title" content="Siddhi HRMS" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const isStaticHost =
        window.location.hostname.includes('github.io') ||
        window.location.protocol === 'file:';

      if (isStaticHost) {
        const s = document.createElement('script');
        s.type = 'module';
        s.crossOrigin = '';
        s.src = './assets/index.js';
        document.body.appendChild(s);
      } else {
        import('/src/main.tsx');
      }
    </script>
  </body>

</html>
