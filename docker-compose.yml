# Siddhi HRMS - Local Server Docker Compose
# Complete self-hosted production deployment stack with PostgreSQL 16 & Persistent Volume
version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: siddhi_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siddhi_hrms}
      POSTGRES_USER: ${POSTGRES_USER:-siddhi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisToAStrongSecretPassword123!}
    volumes:
      - siddhi_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-siddhi_user} -d ${POSTGRES_DB:-siddhi_hrms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - siddhi_network

  # Siddhi HRMS Application (Express + React Frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siddhi_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-siddhi_user}:${POSTGRES_PASSWORD:-ChangeThisToAStrongSecretPassword123!}@postgres:5432/${POSTGRES_DB:-siddhi_hrms}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-siddhi_super_secret_session_key_replace_in_prod}
      BIOMETRIC_POLLING_INTERVAL: ${BIOMETRIC_POLLING_INTERVAL:-15}
    ports:
      - "3000:3000"
    volumes:
      - siddhi_uploads:/app/data/uploads
      - ./data:/app/data
    networks:
      - siddhi_network

volumes:
  siddhi_pgdata:
    name: siddhi_postgres_data
    driver: local
  siddhi_uploads:
    name: siddhi_uploads_data
    driver: local

networks:
  siddhi_network:
    name: siddhi_internal_network
    driver: bridge
